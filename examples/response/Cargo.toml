[package]
name = "response"
version = "0.1.0"
edition = "2021"

[dependencies]
qstring = "0.7"

actix-cloud = { path = "../../actix-cloud", default-features = false, features = [
    "request",
    "state",
    "logger",
    "router",
    "macros",
    "response-json",
    "i18n",
] }

[build-dependencies]

actix-cloud = { path = "../../actix-cloud", default-features = false, features = [
    "response-build",
] }
