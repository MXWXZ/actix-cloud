[package]
name = "actix-cloud"
version = "0.7.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Actix Cloud is an all-in-one web framework based on Actix Web."
license.workspace = true
readme = "../README.md"
repository.workspace = true
keywords = ["http", "web", "framework", "async", "actix"]
categories = [
    "network-programming",
    "asynchronous",
    "web-programming::http-server",
    "web-programming::websocket",
]

[features]
default = [
    "utils",
    "rustls",
    "macros",
    "config-yaml",
    "logger",
    "i18n",
    "request",
    "traceid",
    "state",
    "session",
    "csrf",
    "security",
    "response-json",
]
all = ["default", "config-json", "config-toml", "redis"]

utils = ["dep:rand", "dep:hex"]
rustls = [
    "actix-web?/rustls-0_23",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:thiserror",
]
macros = ["dep:actix-cloud-codegen"]
config-json = ["config", "config/json"]
config-yaml = ["config", "config/yaml"]
config-toml = ["config", "config/toml"]
logger = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:colored",
    "serde",
    "dep:futures",
    "tokio",
    "chrono",
]
i18n = ["actix-cloud-codegen/i18n"]
redis = ["dep:redis", "memorydb"]
request = ["actix-web", "dep:futures", "chrono"]
traceid = ["dep:tracing-actix-web"]
state = ["actix-web", "chrono", "dep:parking_lot"]
session = ["serde", "memorydb", "actix-web", "dep:rand", "dep:thiserror"]
csrf = [
    "dep:qstring",
    "dep:enum-as-inner",
    "actix-web",
    "dep:futures",
    "router",
]
security = ["actix-web"]
response-build = [
    "dep:thiserror",
    "dep:walkdir",
    "dep:yaml-rust2",
    "dep:quote",
    "dep:syn",
    "dep:prettyplease",
]
response-json = ["response", "serde"]

response = ["actix-web", "dep:futures"]
router = ["actix-web", "async-trait", "dep:futures"]
memorydb = [
    "dep:glob",
    "async-trait",
    "dep:parking_lot",
    "chrono",
    "dep:thiserror",
]
config = ["dep:config"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_with", "chrono?/serde"]
actix-web = ["dep:actix-web"]
async-trait = ["dep:async-trait"]
chrono = ["dep:chrono"]
tokio = ["dep:tokio"]

[dependencies]
# utils
rand = { version = "0.10.3", optional = true }
hex = { version = "0.4.3", optional = true }

# errors
thiserror = { version = "2.0.21", optional = true }

# rustls
rustls = { version = "0.23.46", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }

# macros
actix-cloud-codegen = { version = "0.3", path = "../actix-cloud-codegen", optional = true }

# config
config = { version = "0.15.27", optional = true, default-features = false }

# logger
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = [
    "json",
    "parking_lot",
], optional = true }
colored = { version = "3.1.1", optional = true }
futures = { version = "0.3.34", optional = true }

# tokio
tokio = { version = "1.54.1", features = ["full"], optional = true }

# actix-web
actix-web = { version = "4.19.0", features = [
    "secure-cookies",
], optional = true }

# memorydb
glob = { version = "0.3.4", optional = true }
# Pinned to the version already pulled in by tokio (via actix-web) and tracing-subscriber.
# 0.13 would compile a second copy and requires Rust 1.95.
parking_lot = { version = "0.12.5", optional = true }

# chrono
chrono = { version = "0.4.45", optional = true }

# async-trait
async-trait = { version = "0.1.92", optional = true }

# serde
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
serde_with = { version = "3.24.0", optional = true }

# redis
redis = { version = "1.8.1", default-features = false, features = [
    "tokio-rustls-comp",
    "connection-manager",
], optional = true }

# build
walkdir = { version = "2.5.0", optional = true }
# Pinned to the version config 0.15 depends on; 0.13 would compile a second copy.
yaml-rust2 = { version = "0.11.1", optional = true }
quote = { version = "1.0.47", optional = true }
syn = { version = "3.0.10", optional = true }
prettyplease = { version = "0.3.0", optional = true }

# traceid
tracing-actix-web = { version = "0.7.26", optional = true }

# csrf
qstring = { version = "0.7.2", optional = true }
enum-as-inner = { version = "0.7.0", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

[package.metadata.docs.rs]
features = ["all"]
rustdoc-args = ["--cfg", "docsrs"]
