[package]
name = "actix-cloud-codegen"
version = "0.3.0"
edition = "2021"
authors = ["MXWXZ <matrixwxz@gmail.com>"]
description = "Proc macros for Actix Cloud."
license = "MIT"
repository = "https://github.com/MXWXZ/actix-cloud"

[features]
default = []
i18n = ["dep:rust-i18n-support"]

[dependencies]
quote = "1.0"
syn = "3.0"
proc-macro2 = "1.0"

rust-i18n-support = { version = "4.2", features = ["codegen"], optional = true }

[lib]
proc-macro = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
